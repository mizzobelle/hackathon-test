<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handover Note Generator</title>
  <style>
    :root {
      --ink: #18323b;
      --muted: #6b7d82;
      --line: #dce7e7;
      --paper: #ffffff;
      --wash: #f2f7f6;
      --teal: #087f79;
      --teal-dark: #05635f;
      --soft-teal: #e2f2f0;
      --amber: #ad6c1c;
      --shadow: 0 20px 60px rgba(30, 69, 72, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--wash);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .page-shell {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 58px 0 72px;
    }

    header { max-width: 660px; margin-bottom: 32px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--teal);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 2px;
      background: var(--teal);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 5vw, 4.2rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 0.98;
    }

    header p {
      margin: 18px 0 0;
      max-width: 580px;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 22px;
      align-items: start;
    }

    .panel {
      border: 1px solid rgba(190, 211, 211, 0.8);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .form-panel { padding: 27px; }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    h2 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .panel-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.83rem;
    }

    .form-row { margin-bottom: 19px; }

    .form-row label {
      display: block;
      margin-bottom: 7px;
      color: #385259;
      font-size: 0.79rem;
      font-weight: 750;
      letter-spacing: 0.01em;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 13px;
      color: var(--ink);
      background: #fbfdfd;
      font: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:focus, textarea:focus {
      border-color: var(--teal);
      background: var(--paper);
      box-shadow: 0 0 0 3px rgba(8, 127, 121, 0.12);
    }

    textarea { min-height: 92px; resize: vertical; }
    .form-row:last-of-type textarea { min-height: 76px; }

    input::placeholder, textarea::placeholder { color: #9aabad; }

    .form-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 24px;
    }

    .required-note { color: var(--muted); font-size: 0.74rem; }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 8px;
      padding: 12px 17px;
      color: #fff;
      background: var(--teal);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 750;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover { background: var(--teal-dark); box-shadow: 0 7px 16px rgba(8, 127, 121, 0.2); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid rgba(8, 127, 121, 0.3); outline-offset: 2px; }

    .output-panel { min-height: 440px; overflow: hidden; }

    .output-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 25px;
      border-bottom: 1px solid var(--line);
      background: #f8fbfb;
    }

    .output-top .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #b8c8c9; }
    .status-dot.ready { background: var(--teal); }

    .copy-button {
      padding: 8px 12px;
      color: var(--teal-dark);
      background: var(--soft-teal);
      font-size: 0.78rem;
    }

    .copy-button:hover { color: #fff; background: var(--teal); }

    .empty-state {
      display: grid;
      min-height: 380px;
      place-items: center;
      padding: 36px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state p { max-width: 250px; margin: 12px 0 0; font-size: 0.86rem; }

    .empty-icon {
      display: grid;
      width: 48px;
      height: 48px;
      margin: 0 auto;
      place-items: center;
      border: 1px solid #c9e1df;
      border-radius: 50%;
      color: var(--teal);
      background: var(--soft-teal);
      font-size: 1.3rem;
    }

    .note {
      padding: 29px 30px 34px;
      animation: reveal 260ms ease both;
    }

    .note-kicker { margin: 0 0 9px; color: var(--teal); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    .note h3 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 2rem; font-weight: 400; line-height: 1.1; }
    .note-meta { margin: 8px 0 27px; color: var(--muted); font-size: 0.81rem; }
    .note-section { margin-top: 22px; }
    .note-section h4 { margin: 0 0 7px; color: #537075; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    .note-section p { margin: 0; white-space: pre-wrap; font-size: 0.94rem; }
    .task-list { margin: 0; padding-left: 20px; font-size: 0.94rem; }
    .task-list li + li { margin-top: 7px; }
    .task-list li::marker { color: var(--teal); }
    .note-footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.72rem; }

    @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 760px) {
      .page-shell { width: min(100% - 28px, 560px); padding: 34px 0 48px; }
      header { margin-bottom: 25px; }
      .workspace { grid-template-columns: 1fr; }
      .form-panel { padding: 22px; }
      .output-panel { min-height: 360px; }
      .note { padding: 25px 22px 28px; }
    }

    @media (max-width: 430px) {
      .output-top { align-items: flex-start; flex-direction: column; padding: 18px 20px; }
      .copy-button { width: 100%; }
      .form-actions { align-items: stretch; flex-direction: column-reverse; }
      .form-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header>
      <p class="eyebrow">Clinical workflow</p>
      <h1>Handover, made clear.</h1>
      <p>Turn the essentials of a patient update into a concise note ready for the next shift.</p>
    </header>

    <div class="workspace">
      <section class="panel form-panel" aria-labelledby="details-heading">
        <div class="panel-heading">
          <div>
            <h2 id="details-heading">Patient details</h2>
            <p>Capture the latest information.</p>
          </div>
        </div>

        <form id="handover-form">
          <div class="form-row">
            <label for="patient-name">Patient name <span aria-hidden="true">*</span></label>
            <input id="patient-name" name="patientName" type="text" placeholder="e.g. Jordan Lee" required>
          </div>
          <div class="form-row">
            <label for="condition">Condition <span aria-hidden="true">*</span></label>
            <input id="condition" name="condition" type="text" placeholder="e.g. Community-acquired pneumonia" required>
          </div>
          <div class="form-row">
            <label for="key-updates">Key updates <span aria-hidden="true">*</span></label>
            <textarea id="key-updates" name="keyUpdates" placeholder="Observations, treatment changes, response..." required></textarea>
          </div>
          <div class="form-row">
            <label for="outstanding-tasks">Outstanding tasks</label>
            <textarea id="outstanding-tasks" name="outstandingTasks" placeholder="One task per line, or leave blank"></textarea>
          </div>
          <div class="form-actions">
            <span class="required-note">* Required fields</span>
            <button type="submit">Generate note <span aria-hidden="true">&rarr;</span></button>
          </div>
        </form>
      </section>

      <section class="panel output-panel" aria-labelledby="output-heading">
        <div class="output-top">
          <div>
            <h2 id="output-heading">Handover note</h2>
            <div class="status"><span class="status-dot" id="status-dot"></span><span id="status-text">Waiting for details</span></div>
          </div>
          <button class="copy-button" id="copy-button" type="button" hidden>Copy to clipboard</button>
        </div>
        <div id="output-content" class="empty-state">
          <div>
            <div class="empty-icon" aria-hidden="true">+</div>
            <p>Your formatted handover note will appear here.</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const form = document.querySelector('#handover-form');
    const output = document.querySelector('#output-content');
    const copyButton = document.querySelector('#copy-button');
    const statusText = document.querySelector('#status-text');
    const statusDot = document.querySelector('#status-dot');
    let currentNote = '';

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }

    function taskMarkup(value) {
      const tasks = value.split('\n').map((task) => task.trim()).filter(Boolean);
      if (!tasks.length) return '<p>None noted.</p>';
      return '<ul class="task-list">' + tasks.map((task) => '<li>' + escapeHtml(task) + '</li>').join('') + '</ul>';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const patientName = data.get('patientName').trim();
      const condition = data.get('condition').trim();
      const keyUpdates = data.get('keyUpdates').trim();
      const outstandingTasks = data.get('outstandingTasks').trim();
      const date = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date());

      currentNote = [
        'CLINICAL HANDOVER',
        'Patient: ' + patientName,
        'Condition: ' + condition,
        '',
        'KEY UPDATES',
        keyUpdates,
        '',
        'OUTSTANDING TASKS',
        outstandingTasks || 'None noted.',
        '',
        'Generated ' + date
      ].join('\n');

      output.className = 'note';
      output.innerHTML = '<p class="note-kicker">Clinical handover</p>' +
        '<h3>' + escapeHtml(patientName) + '</h3>' +
        '<p class="note-meta">' + escapeHtml(condition) + ' &middot; ' + escapeHtml(date) + '</p>' +
        '<div class="note-section"><h4>Key updates</h4><p>' + escapeHtml(keyUpdates) + '</p></div>' +
        '<div class="note-section"><h4>Outstanding tasks</h4>' + taskMarkup(outstandingTasks) + '</div>' +
        '<p class="note-footer">Prepared for clinical handover</p>';
      copyButton.hidden = false;
      statusText.textContent = 'Ready to share';
      statusDot.classList.add('ready');
    });

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentNote);
        copyButton.textContent = 'Copied';
        setTimeout(() => { copyButton.textContent = 'Copy to clipboard'; }, 1800);
      } catch (error) {
        copyButton.textContent = 'Copy unavailable';
      }
    });
  </script>
</body>
</html>
